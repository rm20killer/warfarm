<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warfarm Tracker - Warframe Codex, Void Relics & Live WorldState</title>
    <meta
      name="description"
      content="Warframe codex, live WorldState fissures tracker, Void relic drop rates calculator, resource farming guide, weapon recipes, and arcane drop tables."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0e0e12" />
    <meta name="author" content="Warfarm Tracker" />

    <!-- Open Graph / Social Sharing -->
    <meta property="og:site_name" content="Warfarm Tracker" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://warfarm.pages.dev/" />
    <meta property="og:title" content="Warfarm Tracker - Warframe Codex, Void Relics & Live WorldState" />
    <meta
      property="og:description"
      content="Search items, calculate Void relic drop rates, track live Void fissures, and find optimal farming nodes across the Star Chart."
    />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Warfarm Tracker - Warframe Codex, Void Relics & Live WorldState" />
    <meta
      name="twitter:description"
      content="Search items, calculate Void relic drop rates, track live Void fissures, and find optimal farming nodes across the Star Chart."
    />

    <link rel="canonical" href="https://warfarm.pages.dev/" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: #0e0e12;
        color: #e0e0e4;
        min-height: 100vh;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }
      #root {
        min-height: 100vh;
      }

      /* Custom scrollbars for clean desktop appearance */
      ::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #0e0e12;
      }
      ::-webkit-scrollbar-thumb {
        background: #24283c;
        border-radius: 3px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #363c5a;
      }

      /* Responsive Layout Utilities */
      .detail-content-grid {
        display: grid;
        grid-template-columns: 1fr 300px;
        gap: 24px;
      }

      @media (max-width: 880px) {
        .detail-content-grid {
          grid-template-columns: 1fr !important;
          gap: 16px !important;
        }
      }

      @media (max-width: 680px) {
        .nav-top-bar {
          padding: 10px 14px !important;
          gap: 10px !important;
        }
        .nav-search-wrapper {
          order: 3;
          flex: 1 1 100% !important;
          max-width: 100% !important;
          margin: 4px 0 0 0 !important;
        }
        .nav-links-scroll {
          padding: 0 14px !important;
          gap: 18px !important;
        }
        .detail-header {
          flex-direction: column !important;
          align-items: stretch !important;
          gap: 14px !important;
        }
        .detail-header-left {
          align-items: flex-start !important;
          gap: 12px !important;
        }
        .detail-target-widget {
          width: 100% !important;
        }
        .detail-target-controls {
          width: 100% !important;
          justify-content: space-between !important;
        }
        .page-container-responsive {
          padding: 12px 12px 60px 12px !important;
        }
        .modal-dialog-responsive {
          padding: 16px !important;
          width: 94vw !important;
          max-height: 88vh !important;
        }
        .card-grid-responsive {
          grid-template-columns: 1fr !important;
        }
      }

      /* Smooth table touch scrolling container */
      .table-scroll-container,
      .rankTableWrapper {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: thin;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/index.tsx"></script>
  </body>
</html>
